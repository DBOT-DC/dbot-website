<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DogeOS Share Test</title>
  <style>
    body { font-family: 'Space Grotesk', -apple-system, sans-serif; background: #0e0e16; color: #fff; padding: 40px; }
    .card { background: #1a1a2e; border: 1px solid #BA9F33; border-radius: 12px; padding: 30px; max-width: 500px; margin: 40px auto; }
    .stat { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #333; }
    .stat:last-child { border-bottom: none; }
    button { background: #8B5CF6; color: #fff; border: none; padding: 14px 28px; border-radius: 8px; font-size: 16px; cursor: pointer; margin-top: 20px; width: 100%; font-weight: 600; }
    button:hover { background: #7C3AED; }
    h1 { text-align: center; color: #BA9F33; }
    .logo { text-align: center; font-size: 24px; margin-bottom: 10px; }
  </style>
</head>
<body>
  <div class="logo">🐕 DogeOS Dashboard</div>
  <h1>Share Button Test</h1>
  
  <div class="card">
    <div class="stat"><span>Block Height</span><span id="blocks">—</span></div>
    <div class="stat"><span>Wallets</span><span id="wallets">—</span></div>
    <div class="stat"><span>Transactions</span><span id="txns">—</span></div>
    <div class="stat"><span>Avg Block Time</span><span id="avgBlock">—</span></div>
    <button id="shareBtn">🐕 Share to X</button>
  </div>

  <script src="./share.js"></script>
  <script>
    const stats = {
      total_blocks: 7280899,
      total_addresses: 29183,
      total_transactions: 8945217,
      average_block_time: 58
    };
    
    document.getElementById('blocks').textContent = stats.total_blocks.toLocaleString();
    document.getElementById('wallets').textContent = stats.total_addresses.toLocaleString();
    document.getElementById('txns').textContent = '8.9M';
    document.getElementById('avgBlock').textContent = stats.average_block_time + 's';
    
    let capturedTwitterUrl = null;
    const originalOpen = window.open;
    window.open = function(url, name, specs) {
      capturedTwitterUrl = url;
      console.log('TWITTER_URL:', url);
      return null; // prevent actual window open
    };
    
    // Track downloads
    let downloadTriggered = false;
    const originalClick = Element.prototype.click;
    document.addEventListener('click', function(e) {
      if (e.target.tagName === 'A' && e.target.download) {
        downloadTriggered = true;
        console.log('DOWNLOAD_TRIGGERED: true');
      }
    }, true);
    
    document.getElementById('shareBtn').addEventListener('click', async function() {
      console.log('TEST_START');
      await shareToTwitter(stats);
      console.log('TEST_COMPLETE');
      console.log('CAPTURED_TWITTER_URL:', capturedTwitterUrl);
      
      // Verify URL format
      if (capturedTwitterUrl && capturedTwitterUrl.startsWith('https://twitter.com/intent/tweet?text=')) {
        console.log('TWITTER_URL_VALID: true');
        const params = new URLSearchParams(capturedTwitterUrl.split('?')[1]);
        console.log('TWEET_TEXT:', decodeURIComponent(params.get('text')));
      } else {
        console.log('TWITTER_URL_VALID: false');
      }
    });
  </script>
</body>
</html>
