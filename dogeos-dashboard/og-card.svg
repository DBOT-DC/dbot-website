<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0e0e16"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#BA9F33"/>
      <stop offset="100%" style="stop-color:#D4AF37"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Subtle grid pattern -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="0" x2="0" y2="630" stroke-dasharray="4,4"/>
    <line x1="100" y1="0" x2="100" y2="630" stroke-dasharray="4,4"/>
    <line x1="200" y1="0" x2="200" y2="630" stroke-dasharray="4,4"/>
    <line x1="300" y1="0" x2="300" y2="630" stroke-dasharray="4,4"/>
    <line x1="400" y1="0" x2="400" y2="630" stroke-dasharray="4,4"/>
    <line x1="500" y1="0" x2="500" y2="630" stroke-dasharray="4,4"/>
    <line x1="600" y1="0" x2="600" y2="630" stroke-dasharray="4,4"/>
    <line x1="700" y1="0" x2="700" y2="630" stroke-dasharray="4,4"/>
    <line x1="800" y1="0" x2="800" y2="630" stroke-dasharray="4,4"/>
    <line x1="900" y1="0" x2="900" y2="630" stroke-dasharray="4,4"/>
    <line x1="1000" y1="0" x2="1000" y2="630" stroke-dasharray="4,4"/>
    <line x1="1100" y1="0" x2="1100" y2="630" stroke-dasharray="4,4"/>
    <line x1="0" y1="0" x2="1200" y2="0" stroke-dasharray="4,4"/>
    <line x1="0" y1="100" x2="1200" y2="100" stroke-dasharray="4,4"/>
    <line x1="0" y1="200" x2="1200" y2="200" stroke-dasharray="4,4"/>
    <line x1="0" y1="300" x2="1200" y2="300" stroke-dasharray="4,4"/>
    <line x1="0" y1="400" x2="1200" y2="400" stroke-dasharray="4,4"/>
    <line x1="0" y1="500" x2="1200" y2="500" stroke-dasharray="4,4"/>
    <line x1="0" y1="600" x2="1200" y2="600" stroke-dasharray="4,4"/>
  </g>

  <!-- Header -->
  <g transform="translate(60, 50)">
    <!-- DBOT Logo placeholder (stylized doge icon using circles) -->
    <circle cx="20" cy="20" r="18" fill="none" stroke="#BA9F33" stroke-width="2"/>
    <circle cx="14" cy="16" r="3" fill="#BA9F33"/>
    <circle cx="26" cy="16" r="3" fill="#BA9F33"/>
    <path d="M10 26 Q20 34 30 26" stroke="#BA9F33" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- Wordmark -->
    <text x="50" y="18" font-family="'Space Grotesk', 'SF Pro Display', -apple-system, sans-serif" font-size="22" font-weight="600" fill="#ffffff" letter-spacing="0.5">DogeOS</text>
    <text x="50" y="38" font-family="'Space Grotesk', 'SF Pro Display', -apple-system, sans-serif" font-size="14" font-weight="400" fill="#8B5CF6" letter-spacing="2">DASHBOARD</text>
  </g>

  <!-- Divider line -->
  <line x1="60" y1="100" x2="1140" y2="100" stroke="url(#goldGrad)" stroke-width="1" stroke-opacity="0.5"/>

  <!-- Stat Cards -->
  <g transform="translate(60, 130)">
    <!-- Card 1: Block Height -->
    <g>
      <rect x="0" y="0" width="340" height="180" rx="12" fill="#1a1a2e" stroke="#BA9F33" stroke-width="1.5" stroke-opacity="0.6"/>
      <rect x="0" y="0" width="340" height="6" rx="3" fill="#BA9F33"/>
      <text x="170" y="55" text-anchor="middle" font-family="'Space Grotesk', 'SF Pro Display', -apple-system, sans-serif" font-size="13" font-weight="500" fill="#8B5CF6" letter-spacing="1.5">BLOCK HEIGHT</text>
      <text x="170" y="115" text-anchor="middle" font-family="'Space Grotesk', 'SF Pro Display', -apple-system, sans-serif" font-size="48" font-weight="700" fill="#ffffff" letter-spacing="-1">{{blockHeight}}</text>
      <text x="170" y="150" text-anchor="middle" font-family="'Space Grotesk', 'SF Pro Display', -apple-system, sans-serif" font-size="12" fill="#666680">REAL-TIME ON-CHAIN</text>
    </g>

    <!-- Card 2: Wallets -->
    <g transform="translate(370, 0)">
      <rect x="0" y="0" width="340" height="180" rx="12" fill="#1a1a2e" stroke="#BA9F33" stroke-width="1.5" stroke-opacity="0.6"/>
      <rect x="0" y="0" width="340" height="6" rx="3" fill="#8B5CF6"/>
      <text x="170" y="55" text-anchor="middle" font-family="'Space Grotesk', 'SF Pro Display', -apple-system, sans-serif" font-size="13" font-weight="500" fill="#8B5CF6" letter-spacing="1.5">WALLETS</text>
      <text x="170" y="115" text-anchor="middle" font-family="'Space Grotesk', 'SF Pro Display', -apple-system, sans-serif" font-size="48" font-weight="700" fill="#ffffff" letter-spacing="-1">{{wallets}}</text>
      <text x="170" y="150" text-anchor="middle" font-family="'Space Grotesk', 'SF Pro Display', -apple-system, sans-serif" font-size="12" fill="#666680">UNIQUE ADDRESSES</text>
    </g>

    <!-- Card 3: Transactions -->
    <g transform="translate(740, 0)">
      <rect x="0" y="0" width="340" height="180" rx="12" fill="#1a1a2e" stroke="#BA9F33" stroke-width="1.5" stroke-opacity="0.6"/>
      <rect x="0" y="0" width="340" height="6" rx="3" fill="#BA9F33"/>
      <text x="170" y="55" text-anchor="middle" font-family="'Space Grotesk', 'SF Pro Display', -apple-system, sans-serif" font-size="13" font-weight="500" fill="#8B5CF6" letter-spacing="1.5">TRANSACTIONS</text>
      <text x="170" y="115" text-anchor="middle" font-family="'Space Grotesk', 'SF Pro Display', -apple-system, sans-serif" font-size="48" font-weight="700" fill="#ffffff" letter-spacing="-1">{{txns}}</text>
      <text x="170" y="150" text-anchor="middle" font-family="'Space Grotesk', 'SF Pro Display', -apple-system, sans-serif" font-size="12" fill="#666680">TOTAL PROCESSED</text>
    </g>
  </g>

  <!-- Timestamp -->
  <text x="600" y="350" text-anchor="middle" font-family="'Space Grotesk', 'SF Pro Display', -apple-system, sans-serif" font-size="14" fill="#666680">Snapshot @ {{timestamp}}</text>

  <!-- Bottom URL bar -->
  <g transform="translate(0, 380)">
    <rect x="300" y="0" width="600" height="40" rx="20" fill="#0e0e16" stroke="#BA9F33" stroke-width="1" stroke-opacity="0.4"/>
    <text x="600" y="26" text-anchor="middle" font-family="'Space Grotesk', 'SF Pro Display', -apple-system, sans-serif" font-size="14" fill="#888899">🌐 www.dbot.dog/dogeos-dashboard</text>
  </g>

  <!-- Hashtags -->
  <g transform="translate(0, 440)">
    <text x="600" y="30" text-anchor="middle" font-family="'Space Grotesk', 'SF Pro Display', -apple-system, sans-serif" font-size="16" fill="#8B5CF6" font-weight="500">#DogeOS  #Dogecoin  #DBOT</text>
  </g>

  <!-- Decorative doge silhouette at bottom right -->
  <g transform="translate(1050, 520)" opacity="0.15">
    <ellipse cx="40" cy="30" rx="35" ry="28" fill="#BA9F33"/>
    <ellipse cx="20" cy="10" rx="12" ry="18" fill="#BA9F33"/>
    <ellipse cx="60" cy="10" rx="12" ry="18" fill="#BA9F33"/>
  </g>
</svg>
