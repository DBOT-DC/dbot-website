      --text-dim: #94a3b8;

      --font-sans: 'Space Grotesk', sans-serif;

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-sans);
      background: var(--bg-primary);
      color: var(--text-primary);
      padding: 2rem;
      max-width: 1440px;

    .panel { margin-bottom: 2rem; }
    .panel-label {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      color: var(--text-dim);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 0.75rem;
      padding-left: 0.25rem;
    }

    /* Mobile (375px) simulated via .viewport class */
    @media (max-width: 480px) {
      body { padding: 1rem; }
      .panel-label::after { content: ' [375px]'; color: var(--purple); }
    }
    @media (min-width: 1200px) {
      .panel-label::after { content: ' [1440px+]'; color: var(--cyan); }

    // ── Mock DataInstance ─────────────────────────────────────────────────────

    class MockDataInstance {
      constructor(initialData) {
        this._data = initialData;
        this._listeners = {};
      }
      get cache() {
        return {
          get: (key) => {
            if (key === 'all') return this._data;
            return this._data[key];
          }
        };
      }
      on(event, cb) {
        if (!this._listeners[event]) this._listeners[event] = [];
        this._listeners[event].push(cb);
      }
      emit(event, data) {
        (this._listeners[event] || []).forEach(cb => cb(data));
      }
    }
