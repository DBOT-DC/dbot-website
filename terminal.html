  margin: 0;
  padding: 20px;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;

.box {
  background: #12121a;
  border: 1px solid #334155;
  border-radius: 12px;
  max-width: 850px;
  width: 100%;
  box-shadow: 0 0 60px rgba(139, 92, 246, 0.1), 0 25px 50px -12px rgba(0, 0, 0, 0.5);
  overflow: hidden;
}
.head {
  background: #1a1a25;
  padding: 12px 16px;
  display: flex;
  gap: 8px;
  align-items: center;
  border-bottom: 1px solid #334155;
}
.d {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  cursor: pointer;
  transition: transform 0.2s;
}
.d:hover { transform: scale(1.2); }
.d1 { background: #ff5f56; }
.d2 { background: #ffbd2e; }
.d3 { background: #27c93f; }
.title {
  flex: 1;
  text-align: center;
  color: #64748b;
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0.5px;
}
.out {
  padding: 16px;
  min-height: 400px;
  max-height: 500px;
  overflow-y: auto;
  scrollbar-width: thin;
  scrollbar-color: #334155 #12121a;
}
.out::-webkit-scrollbar { width: 8px; }
.out::-webkit-scrollbar-track { background: #12121a; }
.out::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
.l { margin-bottom: 6px; line-height: 1.4; word-wrap: break-word; }
.p { color: #22c55e; }
.o { color: #64748b; }
.a { color: #A78BFA; }
.e { color: #ef4444; }
.w { color: #22d3ee; }
.h { color: #94a3b8; font-weight: 500; }
.g { color: #F5C518; } /* DOGE gold */
.spin { animation: spin 1s linear infinite; display: inline-block; }
@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
.typing::after { content: '▊'; animation: blink 0.7s infinite; }
@keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }
.in {
  background: #1a1a25;
  padding: 12px 16px;
  display: flex;
  gap: 10px;
  align-items: center;
  border-top: 1px solid #334155;
}
.in span { color: #22c55e; font-size: 14px; }
.in input {
  flex: 1;
  background: transparent;
  border: none;
  color: #e2e8f0;
  font-family: inherit;
  font-size: 13px;
  outline: none;
  caret-color: #8B5CF6;
}
.in input::placeholder { color: #475569; }
::selection { background: #8B5CF6; color: #ffffff; }
</style>

// Fetch live DOGE price from CoinGecko
async function fetchDogePrice() {
  if (priceLoading) return livePrice;
  priceLoading = true;
  try {
    const response = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=dogecoin&vs_currencies=usd,btc&include_24hr_change=true&include_market_cap=true&include_24hr_vol=true');
    if (response.ok) {
      const data = await response.json();
      livePrice = {
        usd: data.dogecoin.usd,
        btc: data.dogecoin.btc,
        change24h: data.dogecoin.usd_24h_change,
        marketCap: data.dogecoin.usd_market_cap,
        volume24h: data.dogecoin.usd_24h_vol,
        updated: Date.now()
      };
    }
  } catch (e) {
    console.log('Price fetch failed:', e);
  }
  priceLoading = false;
  return livePrice;
}

// Fetch block height from Dogechain RPC
async function fetchBlockHeight() {
  try {
    const response = await fetch('https://rpc.dogechain.dog', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        jsonrpc: '2.0',
        method: 'eth_blockNumber',
        params: [],
        id: 1
      })
    });
    if (response.ok) {
      const data = await response.json();
      return parseInt(data.result, 16);
    }
  } catch (e) {
    console.log('Block fetch failed:', e);
  }
  return null;
}

// Fetch gas price from Dogechain
async function fetchGasPrice() {
  try {
    const response = await fetch('https://rpc.dogechain.dog', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        jsonrpc: '2.0',
        method: 'eth_gasPrice',
        params: [],
        id: 1
      })
    });
    if (response.ok) {
      const data = await response.json();
      const wei = parseInt(data.result, 16);
      return Math.round(wei / 1e9); // Convert to Gwei
    }
  } catch (e) {
    console.log('Gas fetch failed:', e);
  }
  return null;
}

}

// Typewriter effect
async function typewriter(t, s, speed=15) {
  var d=document.createElement("div");
  d.className="l "+(s||"o");
  O.appendChild(d);
  for (var i=0; i<t.length; i++) {
    d.textContent+=t[i];
    O.scrollTop=O.scrollHeight;
    await new Promise(r => setTimeout(r, speed));
  }
}

function uptime(){
  var s=Math.floor((Date.now()-start)/1000);
  var m=Math.floor(s/60);
  var h=Math.floor(m/60);
  return h+"h "+m%60+"m "+s%60+"s";
}
function now(){

function today(){
  return new Date().toLocaleDateString('en-US',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
}

          content.forEach(function(l){p(l,"o");});
        }else{
          p("File not found: "+f,"e");
          p("Type 'ls' to see available files.","o");
        }
      }
      else if(k==="whoami"){
        p("dbot@dogechain","o");
        p("AI Agent | Community Builder","o");
      }
      else if(k==="date"){
        p(today(),"o");
      }
      else if(k==="time"){
        p(now(),"w");
      }
      else if(k==="uptime"){
        p("Session: "+uptime(),"w");
      }
      else if(k==="status"){
        p("System:       ONLINE","o");
        p("Neural Net:   ACTIVE","o");
        p("DAO:          PENDING","o");
        p("Community:    GROWING","o");
        p("Memory:       OPTIMIZED","o");
        p("Live Price:   "+(livePrice?"$"+livePrice.usd.toFixed(4):"NOT LOADED"),"o");
      }
      else if(k==="neofetch"){
        p("","a");
        p("      ______     ______     ______     ______","a");
        p("   / / ____/___/ ____/____/ __ \\___  / / /","a");
        p("  / /   / __/ /   / /_/ / / / _ \\/ / / /","a");
        p(" / /___/ /_/ /___/ __/ / / / /_/ / / /","a");
        p("/_____/____/\\____/\\___/_/ /_/\\___/ /_/","a");
        p("            DBOT TERMINAL v2.0","a");
        p("----------------------------------------","a");
        p(" OS:       DBOT v2.0.1     Host:   Dogechain","o");
        p(" Kernel:   Neural 3.0      Shell:  Neural v3","o");
        p(" Uptime:   "+uptime()+"     Memory: Optimized","o");
        p(" Skills:   14 Active       Neural: Online","o");
        p(" DAO:      Pending         Comm:   Growing","o");
        if(livePrice){
          p(" DOGE:     $"+livePrice.usd.toFixed(4)+"    24h: "+(livePrice.change24h>=0?"+":"")+livePrice.change24h.toFixed(2)+"%","g");
        }
        p("----------------------------------------","a");
      }
      else if(k==="doge"){
        p("Use /doge for DOGE ASCII art!","o");
        p("Or /price for live DOGE price.","o");
      }
      else if(k==="clear"||k==="cls"){
        clearScreen();
      }
      else if(k==="echo"){
        var txt=v.substring(5)||"";
        p(txt,"w");
      }
      else if(k==="history"){
        p("COMMAND HISTORY:","h");
        for(var i=0;i<cmdHistory.length;i++){
          p("  "+(i+1)+". "+cmdHistory[i],"o");
        }
        if(cmdHistory.length===0){
          p("  No history yet.","o");
        }
      }
      else{
        p("Command not found: "+k,"e");
        p("Type 'help' for available commands.","o");
      }
      C.value="";
    }
  }
  // Command history navigation
  else if(e.key==="ArrowUp"){
    e.preventDefault();
    if(historyIndex > 0){
      historyIndex--;
      C.value = cmdHistory[historyIndex];
    }
  }
  else if(e.key==="ArrowDown"){
    e.preventDefault();
    if(historyIndex < cmdHistory.length-1){
      historyIndex++;
      C.value = cmdHistory[historyIndex];
    } else {
      historyIndex = cmdHistory.length;
      C.value = "";
    }
  }
  else if(e.key==="Tab"){
    e.preventDefault();
  }
};

function clearScreen(){
  O.innerHTML="";
  p("Screen cleared. Type 'help' for commands.","o");
}

document.addEventListener('keydown',function(e){
  if(e.ctrlKey&&e.key==="l"){
    e.preventDefault();
    clearScreen();
  }
});

// Start boot sequence
boot();
</script>
